<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Embassy Visa AI Assistant</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col h-screen font-sans">

    <!-- Header -->
    <header class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h1 class="font-bold text-base flex items-center gap-2">
            ✈️ BTS Embassy Visa AI
        </h1>
        <span id="user-greeting" class="text-xs opacity-70">ሰላም!</span>
    </header>

    <!-- Chat Box Container -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
        <!-- Welcome Message from AI -->
        <div class="self-start bg-slate-200 dark:bg-slate-800 p-3 rounded-2xl max-w-[85%] text-sm">
            ሰላም! ስለ ቪዛ፣ የጉዞ መረጃ፣ በረራዎች ወይም ሆቴሎች የሚፈልጉትን ማንኛውንም ጥያቄ በአማርኛ መጠየቅ ይችላሉ።
        </div>
    </div>

    <!-- Input Form Area -->
    <div class="p-3 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
        <form id="chat-form" class="flex gap-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="ጥያቄዎን እዚህ ይጻፉ..." 
                class="flex-1 bg-slate-100 dark:bg-slate-800 border-none rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
            >
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition"
            >
                ላክ
            </button>
        </form>
    </div>

    <!-- JavaScript Logic & Gemini API Connection -->
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `ሰላም፣ ${tg.initDataUnsafe.user.first_name}`;
        }

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        // ---- YOUR GEMINI API CONFIGURATION ----
        const GEMINI_API_KEY = 'AQ.Ab8RN6LlPPFN56pHu61s2KjHksTZuLht4pL5JtvShEz4f36DsQ';
        
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Show User Message
            appendMessage(text, 'user');
            userInput.value = '';

            // 2. Show Loading Indicator
            const loadingId = appendMessage('እየፈለግሁ ነው...', 'ai', true);

            try {
                // Call Gemini API
                const botReply = await getGeminiResponse(text);
                
                document.getElementById(loadingId).remove();
                appendMessage(botReply, 'ai');
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('ይቅርታ፣ ከግንኙነት ጋር የተያያዘ ችግር አጋጥሟል። እባክዎ ትንሽ ቆይተው እንደገና ይሞክሩ።', 'ai');
                console.error(error);
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            
            if (sender === 'user') {
                messageDiv.className = 'self-end bg-blue-600 text-white p-3 rounded-2xl max-w-[85%] text-sm';
            } else {
                messageDiv.className = `self-start bg-slate-200 dark:bg-slate-800 p-3 rounded-2xl max-w-[85%] text-sm whitespace-pre-wrap ${isLoading ? 'opacity-60 animate-pulse' : ''}`;
            }
            
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        async function getGeminiResponse(prompt) {
            const systemInstruction = "አንተ 'BTS Embassy Visa News and Consultant' የተባለ የጉዞ እና የቪዛ አማካሪ ድርጅት AI ረዳት ነህ። ለተጠቃሚዎች ስለ ኤምባሲ ቪዛዎች፣ የጉዞ መረጃዎች፣ በረራዎች እና ሆቴሎች በአማርኛ ቋንቋ ግልጽ፣ ቀጥተኛ እና አጋዥ የሆኑ መረጃዎችን መስጠት አለብህ።";

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: `${systemInstruction}\n\nየተጠቃሚው ጥያቄ፡ ${prompt}` }]
                        }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return data.candidates[0].content.parts[0].text;
            } else {
                throw new Error("Invalid API response format");
            }
        }
    </script>
</body>
</html>
