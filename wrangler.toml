name = "bts-visa-telegram-miniapp"
main = "src/index.js"
compatibility_date = "2026-11-09"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create a KV namespace and replace the placeholder ID below.
[[kv_namespaces]]
binding = "BTS_DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
